<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sick Lovely Beasts ~Rewrite Diary~</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            /* 全体の背景：もう少し明度を上げたダークパープル＆スモーキーブルー */
            background-color: #161022;
            background-image: 
                radial-gradient(circle at 50% 30%, #31214a 0%, #120c1d 80%),
                linear-gradient(rgba(255,0,128,0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 3px;
            color: #d1b3e0;
            font-family: 'DotGothic16', monospace, sans-serif;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 走査線・グリッチノイズ */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 0, 127, 0.05) 50%), linear-gradient(90deg, rgba(0, 255, 255, 0.02), rgba(255, 0, 127, 0.03), rgba(0, 0, 255, 0.02));
            z-index: 999;
            background-size: 100% 3px, 4px 100%;
            pointer-events: none;
            opacity: 0.8;
        }

        /* 画面の微弱な揺らぎ・横ノイズ */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(120, 40, 100, 0.06);
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
            animation: screen-noise 5s infinite;
        }

        @keyframes screen-noise {
            0%, 92%, 96% { opacity: 0; transform: translateY(0); filter: hue-rotate(0deg); }
            93% { opacity: 0.4; transform: translateY(-3px); filter: hue-rotate(15deg); }
            94% { opacity: 0.15; transform: translateY(6px); }
            95% { opacity: 0.35; transform: translateY(-2px); filter: hue-rotate(-15deg); }
            97% { opacity: 0.1; transform: translateY(2px); }
        }

        .container {
            width: 100%;
            max-width: 320px;
            margin: auto;
            /* コンテナの背景も少し明度を上げて見やすく */
            background-color: rgba(26, 19, 36, 0.92);
            border: 2px solid #ff4da6;
            padding: 15px 12px;
            box-shadow: 0 0 20px rgba(255, 77, 166, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        /* 挨拶：ちょっとだけ横にうねうね動く演出 */
        .welcome-msg {
            font-size: 0.68rem;
            color: #ff80bf;
            margin-bottom: 6px;
            letter-spacing: 1.5px;
            text-align: center;
            opacity: 0.85;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.8), 0 0 10px rgba(0, 240, 255, 0.4);
            animation: text-sway 4s ease-in-out infinite, text-flicker 3s infinite;
        }

        @keyframes text-sway {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(4px); }
        }

        @keyframes text-flicker {
            0%, 100% { opacity: 0.85; text-shadow: 0 0 5px rgba(255, 0, 127, 0.8); }
            50% { opacity: 0.35; text-shadow: 0 0 1px rgba(255, 0, 127, 0.2); }
            52% { opacity: 0.95; text-shadow: 0 0 8px rgba(0, 240, 255, 0.9), 0 0 4px rgba(255, 0, 127, 0.9); }
            54% { opacity: 0.45; text-shadow: 0 0 2px rgba(255, 0, 127, 0.4); }
        }

        /* タイトル：微妙に横揺れ */
        h1 {
            font-size: 0.88rem;
            color: #00f0ff;
            background: rgba(45, 26, 64, 0.8);
            border-top: 1px dashed #ff4da6;
            border-bottom: 1px dashed #ff4da6;
            padding: 6px;
            margin: 0 0 12px 0;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.7);
            animation: title-jitter 6s ease-in-out infinite;
        }

        @keyframes title-jitter {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        .label-tag {
            display: inline-block;
            background: rgba(255, 77, 166, 0.2);
            color: #ff80bf;
            font-size: 0.7rem;
            padding: 2px 10px;
            border-left: 3px solid #00f0ff;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 3px rgba(255, 77, 166, 0.5);
        }

        /* キャラクターアイコン（正方形・アイコンのみ・小刻みランダムジャンプ） */
        .char-5icons-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            border: none;
            padding: 4px 0;
            margin: 4px 0 10px 0;
        }

        .char-icon-item {
            width: 48px;
            height: 48px;
            border: none;
            background: transparent;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            filter: brightness(0.88) contrast(1.25) saturate(0.9);
            transition: filter 0.2s ease, transform 0.2s ease;
        }

        .char-icon-item:nth-child(1) { animation: jitter-jump-1 1.2s infinite steps(4, start); }
        .char-icon-item:nth-child(2) { animation: jitter-jump-2 0.9s infinite steps(3, start); }
        .char-icon-item:nth-child(3) { animation: jitter-jump-3 1.5s infinite steps(5, start); }
        .char-icon-item:nth-child(4) { animation: jitter-jump-4 1.1s infinite steps(4, start); }
        .char-icon-item:nth-child(5) { animation: jitter-jump-5 1.3s infinite steps(3, start); }

        @keyframes jitter-jump-1 {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(1px, -3px); }
            40% { transform: translate(-1px, 0); }
            60% { transform: translate(0, -2px); }
            80% { transform: translate(1px, -1px); }
        }
        @keyframes jitter-jump-2 {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-1px, -2px); }
            50% { transform: translate(1px, -4px); }
            75% { transform: translate(0, -1px); }
        }
        @keyframes jitter-jump-3 {
            0%, 100% { transform: translate(0, 0); }
            15% { transform: translate(1px, -4px); }
            45% { transform: translate(0, -1px); }
            70% { transform: translate(-1px, -3px); }
            90% { transform: translate(1px, 0); }
        }
        @keyframes jitter-jump-4 {
            0%, 100% { transform: translate(0, 0); }
            30% { transform: translate(0, -3px); }
            60% { transform: translate(-1px, -1px); }
            85% { transform: translate(1px, -4px); }
        }
        @keyframes jitter-jump-5 {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-1px, -2px); }
            50% { transform: translate(1px, -3px); }
            80% { transform: translate(0, -1px); }
        }

        .char-icon-item:hover {
            transform: scale(1.1) translateY(-2px) !important;
            filter: brightness(1.05) contrast(1.3) saturate(1.1);
        }

        /* メインプレイボタン（準備中・点滅演出付き） */
        .play-btn-wrap {
            text-align: center;
            margin: 12px 0;
        }

        .play-btn {
            display: inline-block;
            background: rgba(36, 26, 52, 0.9);
            color: #ff80bf;
            padding: 6px 16px;
            text-decoration: none;
            border: 1px solid #ff4da6;
            font-size: 0.78rem;
            cursor: not-allowed;
            letter-spacing: 1px;
            text-shadow: 0 0 3px rgba(255, 77, 166, 0.5);
            animation: btn-blink 1s ease-in-out infinite;
        }

        @keyframes btn-blink {
            0%, 100% { opacity: 1; border-color: #ff4da6; }
            50% { opacity: 0.3; border-color: #00f0ff; }
        }

        /* リンク一覧（古のインターネット風の青いリンク文字：#0000ff / 下線付き） */
        .link-list {
            list-style: none;
            padding: 0;
            margin: 8px 0;
            border: 1px solid #ff4da6;
            background: rgba(30, 22, 42, 0.85);
        }

        .link-list li {
            border-bottom: 1px dotted #553573;
        }

        .link-list li:last-child {
            border-bottom: none;
        }

        .link-list a {
            color: #0000ff;
            text-decoration: underline;
            padding: 5px 8px;
            display: block;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }

        .link-list a:hover {
            background: rgba(255, 77, 166, 0.25);
            color: #ffffff;
            transform: translateX(3px);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        /* 横並びボタンエリア（不具合報告＆アンケート）も古の青いリンク文字に統一 */
        .btn-group-area {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin: 10px 0;
            background: rgba(30, 22, 42, 0.85);
            border: 1px solid #ff4da6;
            padding: 6px;
        }

        .sub-btn {
            flex: 1;
            text-align: center;
            background: rgba(45, 33, 64, 0.9);
            color: #0000ff;
            padding: 5px 4px;
            text-decoration: underline;
            border: 1px solid #553573;
            font-size: 0.7rem;
            transition: background 0.2s, color 0.2s;
        }

        .sub-btn:hover {
            background: rgba(255, 77, 166, 0.25);
            color: #ffffff;
        }

        /* フッター・注意書き */
        .footer {
            margin-top: 12px;
            font-size: 0.68rem;
            border-top: 1px dashed #ff4da6;
            padding-top: 8px;
        }

        .footer-item {
            background: rgba(30, 22, 42, 0.75);
            border: 1px solid #553573;
            padding: 5px;
            margin-bottom: 5px;
            text-align: left;
        }

        .footer-label {
            font-weight: bold;
            color: #ff80bf;
            border-bottom: 1px dotted #553573;
            margin-bottom: 2px;
            padding-bottom: 1px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* モーダル画像表示 */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(18, 12, 29, 0.92);
            backdrop-filter: blur(3px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        #overlay img {
            max-width: 85%;
            max-height: 80%;
            border: 2px solid #ff4da6;
            box-shadow: 0 0 25px rgba(255, 77, 166, 0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 挨拶 -->

    <!-- ヘッダータイトル -->
    <h1>Sick Lovely Beasts ~Rewrite Diary~</h1>

    <div style="text-align: center;">

    <!-- フッター情報 -->
    <div class="footer">
        <div class="footer-item">
            <div class="footer-label">ネタバレ・二次創作</div>
            <div>・スクショSNS投稿OK！</div>

        <div class="footer-item">
            <div class="footer-label">Caution</div>

        </div>
        <div style="text-align: center; margin-top: 8px; font-size: 0.65rem; color: #ff80bf; letter-spacing: 1px;">
            Copyright (c) Suzuki.M All Rights Reserved.
        </div>
    </div>

</div>

<!-- 画像拡大用オーバーレイ -->
<div id="overlay" onclick="closeModal()">
    <img id="modal-img" src="" alt="Character Detail">
</div>

<script>
    function openModal(imgSrc) {
        document.getElementById('modal-img').src = imgSrc;
        document.getElementById('overlay').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
    }
</script>

</body>
</html>
